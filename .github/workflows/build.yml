name: Build JXOfflineAuto

on:
  push:
    paths:
      - "auto/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "auto/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-jxofflineauto-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Release / x86 / .NET Framework 4.0
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Show .NET environment
        run: dotnet --info

      - name: Restore
        run: dotnet restore auto/kykeoxe.csproj

      - name: Build Release x86
        run: >-
          dotnet build auto/kykeoxe.csproj
          --configuration Release
          --no-restore
          -p:PlatformTarget=x86
          -p:ContinuousIntegrationBuild=true

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: JXOfflineAuto-net40-x86
          path: auto/bin/Release/net40/**
          if-no-files-found: error
          retention-days: 14
